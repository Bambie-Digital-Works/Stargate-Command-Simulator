name: Wormhole Worlds Windows CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wormhole-worlds-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  BuildChannel: ${{ github.ref == 'refs/heads/main' && 'nightly' || 'development' }}
  BuildId: ${{ github.run_number }}
  CommitSha: ${{ github.sha }}

jobs:
  validate-and-package:
    name: Validate and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set immutable build timestamp
        shell: pwsh
        run: '"BuildUtc=$([DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ"))" | Add-Content -LiteralPath $env:GITHUB_ENV'

      - name: Cache verified Godot toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\wormhole-worlds-godot
          key: godot-4.7.2-mono-win64-${{ github.ref == 'refs/heads/main' && 'with-templates' || 'editor' }}

      - name: Install and verify Godot
        id: godot
        shell: pwsh
        run: |
          $includeTemplates = '${{ github.event_name }}' -ne 'pull_request'
          $godotPath = ./tools/Install-Godot.ps1 -Destination '${{ runner.temp }}\wormhole-worlds-godot' -IncludeExportTemplates:$includeTemplates
          "path=$godotPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Restore, format, build, test, validate, and smoke test
        id: verify
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -eq 'refs/heads/main') {
            ./tools/Verify.ps1 -GodotPath '${{ steps.godot.outputs.path }}' -ExportDirectory 'build/package'
          } else {
            ./tools/Verify.ps1 -GodotPath '${{ steps.godot.outputs.path }}' -SkipExport
          }

      - name: Upload unsigned Windows development artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: ${{ steps.verify.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  release-preview:
    name: Build and publish preview release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate-and-package
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install verified Godot and Inno Setup toolchains
        id: toolchain
        shell: pwsh
        run: |
          $godotPath = ./tools/Install-Godot.ps1 -Destination '${{ runner.temp }}\wormhole-worlds-release-godot' -IncludeExportTemplates
          $isccPath = ./tools/Install-InnoSetup.ps1 -Destination '${{ runner.temp }}\wormhole-worlds-inno'
          "godot=$godotPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "iscc=$isccPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Build verified release artifacts
        id: release
        shell: pwsh
        run: |
          ./tools/Build-Release.ps1 `
            -GodotPath '${{ steps.toolchain.outputs.godot }}' `
            -DotnetPath (Get-Command dotnet).Source `
            -IsccPath '${{ steps.toolchain.outputs.iscc }}' `
            -OutputDirectory 'dist/v0.8.0-beta.1'

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            (Get-ChildItem -LiteralPath '${{ steps.release.outputs.release_path }}' -File | ForEach-Object FullName) `
            --prerelease `
            --verify-tag `
            --title 'Wormhole Worlds Simulator 0.8.0-beta.1' `
            --notes-file 'docs/RELEASE_NOTES_0.8.0-beta.1.md'
