name: Feature
description: Concrete product capability or shippable slice with scope and test plan.
title: "[Feature]: "
labels: ["feature"]
type: feature
body:
  - type: markdown
    attributes:
      value: |
        A **Feature** is a shippable capability. Keep scope tight; split large work into an Epic with multiple Features.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken, missing, or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What we will build and how it should behave at a high level.
    validations:
      required: true
  - type: textarea
    id: scope-in
    attributes:
      label: In scope
      value: |
        - …
    validations:
      required: true
  - type: textarea
    id: scope-out
    attributes:
      label: Out of scope
      value: |
        - …
    validations:
      required: true
  - type: textarea
    id: test-plan
    attributes:
      label: Test plan
      description: Manual and/or automated checks that prove the feature works.
      value: |
        - [ ] …
        - [ ] …
    validations:
      required: true
  - type: textarea
    id: technical-notes
    attributes:
      label: Technical notes
      description: APIs, data model, migrations, feature flags, compatibility.
    validations:
      required: false
  - type: dropdown
    id: product-area
    attributes:
      label: Product area
      options:
        - Script / tooling
        - Application / service
        - Game systems
        - Store / commerce
        - Infra / platform
        - Cross-cutting
      default: 0
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — critical
        - P1 — high
        - P2 — medium
        - P3 — low
      default: 2
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Feature readiness
      options:
        - label: In/out scope are agreed
          required: true
        - label: Test plan covers happy path and main failure modes
          required: true
